name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-gettext

    # =========================================================================
    # 缓存 wxWidgets 和 Paho 的编译产物
    # =========================================================================
    - name: Cache wxWidgets
      id: cache-wx
      uses: actions/cache@v4
      with:
        path: third_party/wxWidgets/lib
        key: wxwidgets-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-release

    - name: Cache Paho
      id: cache-paho
      uses: actions/cache@v4
      with:
        path: |
          third_party/paho.mqtt.c/build/install
          third_party/paho.mqtt.cpp/build/install
        key: paho-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-release

    # =========================================================================
    # 编译依赖 (如果没有命中缓存)
    # =========================================================================
    - name: Build wxWidgets
      if: steps.cache-wx.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        cd third_party/wxWidgets
        mkdir -p build-ci && cd build-ci
        ../configure --enable-shared --disable-tests --disable-monolithic --with-msw CFLAGS="-O2" CXXFLAGS="-O2"
        make -j$(nproc)

    - name: Build Paho
      if: steps.cache-paho.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        ./scripts/build_paho.sh

    # =========================================================================
    # 编译与测试
    # =========================================================================
    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cmake -S . -B build -G "Ninja" \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DICU_BUILD_TESTS=ON

    - name: Build
      shell: msys2 {0}
      run: |
        cmake --build build -j$(nproc)

    - name: Test
      shell: msys2 {0}
      run: |
        cd build
        ctest --output-on-failure -C ${{ matrix.build_type }}

    - name: Format Check
      shell: msys2 {0}
      run: |
        pip install clang-format==19.1.5
        ./scripts/format.sh check
